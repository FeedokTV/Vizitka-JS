services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vizitka
      POSTGRES_PASSWORD: vizitka
      POSTGRES_DB: vizitka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizitka -d vizitka"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://vizitka:vizitka@db:5432/vizitka?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
